# ===================================================================
# Test Environment Properties
# In-memory H2 database with MySQL emulation mode for automated tests
# Does not require a live MySQL server during Maven builds
# ===================================================================
spring.datasource.url=jdbc:h2:mem:car_rental_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Test-Only JWT Security Configuration (Never used in production)
jwt.secret=test_jwt_secret_key_minimum_32_characters_long_for_unit_tests!
jwt.expiration.ms=86400000
cors.allowed.origins=http://localhost:5173
